<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ГЕРОЙ 360° — генератор хеша пароля</title>
  <style>
    body{font:16px system-ui;max-width:700px;margin:60px auto;padding:0 20px;color:#17223b}label{display:grid;gap:8px;margin:22px 0}input,textarea,button{font:inherit;padding:12px;border:1px solid #ccd2df;border-radius:10px}textarea{min-height:90px}button{background:#6848d9;color:#fff;font-weight:700;border:0}.note{color:#66718a;line-height:1.5}.box{background:#f7f5ff;border-radius:18px;padding:22px}
  </style>
</head>
<body>
  <h1>Локальный генератор хеша</h1>
  <p class="note">Страница работает только в вашем браузере. Пароль никуда не отправляется. Откройте файл локально, создайте сильный пароль и сохраните два результата как Cloudflare Worker secrets.</p>
  <div class="box">
    <label>Пароль для <code>laila.teacher</code><input id="password" type="password" autocomplete="new-password" minlength="12"></label>
    <button id="generate">Создать соль и хеш</button>
    <label>TEACHER_PASSWORD_SALT<textarea id="salt" readonly></textarea></label>
    <label>TEACHER_PASSWORD_HASH<textarea id="hash" readonly></textarea></label>
  </div>
  <script>
    const bytesToBase64 = bytes => btoa(String.fromCharCode(...bytes));
    document.getElementById("generate").addEventListener("click", async () => {
      const password = document.getElementById("password").value;
      if (password.length < 12) return alert("Используйте не менее 12 символов.");
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: 210000 }, key, 256);
      document.getElementById("salt").value = bytesToBase64(salt);
      document.getElementById("hash").value = bytesToBase64(new Uint8Array(bits));
      document.getElementById("password").value = "";
    });
  </script>
</body>
</html>
